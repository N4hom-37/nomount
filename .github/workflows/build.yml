name: build module

on:
  push:
    branches: [ master, dev ]
    paths-ignore: 
      - '**.md'
      - '**.git*'
      - '**.sh'
      - '**.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag'
        required: true
        default: 'v1.0.0'
        type: string
      publish_release:
        description: 'Publish release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-lkm:
    uses: ./.github/workflows/build-lkm.yml
    with:
      build_all: true

  build-module:
    needs: build-lkm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup zig
        uses: jetsung/setup-zig@v0.0.4
        with:
          version: master

      - name: grab sstrip from ELFkickers
        run: |
          curl -L https://www.muppetlabs.com/~breadbox/pub/software/ELFkickers-3.2.tar.gz -o sstrip.tar.gz
          tar xf sstrip.tar.gz
          make -C ELFkickers-3.2 sstrip
          cp ELFkickers-3.2/sstrip/sstrip .
          chmod +x ./sstrip

      - name: compile nm via zigcc
        run: |
          mkdir bin
          cd userspace/src
          zig cc -target aarch64-linux -Oz -mcmodel=tiny -static -nostdlib -ffreestanding -fno-unwind-tables \
            -fno-ident -Wno-invalid-noreturn -Wl,--entry=_start nm.c -o ../../bin/nm-arm64

          zig cc -target arm-linux -Oz -static -nostdlib -ffreestanding -fno-unwind-tables -fno-ident -Wno-invalid-noreturn \
            -ffunction-sections -fdata-sections -Wl,--gc-sections -Wl,--entry=_start nm.c -o ../../bin/nm-arm

          cd ../../bin
          ../sstrip -z nm-arm64
          ../sstrip -z nm-arm

          file nm-*
          mkdir -p ../module/bin
          mv nm-* ../module/bin/

      - name: compile ko-loader via zigcc
        run: |
          git clone https://github.com/maxsteeel/ko-loader.git ko_loader_src
          cd ko_loader_src

          make TARGET=aarch64-linux
          mv ko-loader ko-loader-arm64

          make TARGET=arm-linux
          mv ko-loader ko-loader-arm

          ../sstrip -z ko-loader-arm64
          ../sstrip -z ko-loader-arm

          file ko-loader-*
          mv ko-loader-* ../module/bin/

      - name: Download all LKM artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: nomount-*
          path: module/lkm
          merge-multiple: true

      - name: Update version code
        run: sed -i 's/^versionCode=.*/versionCode=${{ github.run_number }}/' module/module.prop

      - name: Extract module metadata
        run: |
          NAME=$(sed -n 's/^name=//p' module/module.prop | tr -d '\r' | tr -d ' ')
          VERSION=$(sed -n 's/^version=//p' module/module.prop | tr -d '\r' | tr -d ' ')
          SHORT_HASH=$(git rev-parse --short HEAD)
          echo "MODULE_NAME=$NAME" >> $GITHUB_ENV
          echo "MODULE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "COMMIT_HASH=$SHORT_HASH" >> $GITHUB_ENV

      - name: Optimize release module (via standalone esbuild)
        run: |
          MODULE_BUILD="$RUNNER_TEMP/nomount-module-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          WEBUI_BUILD="$RUNNER_TEMP/nomount-webui-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          cp -a module "$MODULE_BUILD"
          mkdir -p "$WEBUI_BUILD"
          sed '/@import ".\/theme.css";/d' module/webroot/styles.css > "$WEBUI_BUILD/temp.css"
          cat "$WEBUI_BUILD/temp.css" module/webroot/theme.css > "$WEBUI_BUILD/combined.css"

          curl -sL "https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-0.28.1.tgz" -o /tmp/esbuild.tgz
          tar -xzf /tmp/esbuild.tgz -C /tmp && mv /tmp/package/bin/esbuild /tmp/esbuild && chmod +x /tmp/esbuild
          /tmp/esbuild module/webroot/index.js --bundle --format=esm --minify --outfile="$WEBUI_BUILD/index.js"
          /tmp/esbuild "$WEBUI_BUILD/combined.css" --minify --outfile="$WEBUI_BUILD/styles.css"
          tr '\n' ' ' < module/webroot/index.html | sed 's/  */ /g' | sed 's/> </></g' > "$WEBUI_BUILD/index.html"

          install -m 0644 "$WEBUI_BUILD/index.js" "$MODULE_BUILD/webroot/index.js"
          install -m 0644 "$WEBUI_BUILD/styles.css" "$MODULE_BUILD/webroot/styles.css"
          install -m 0644 "$WEBUI_BUILD/index.html" "$MODULE_BUILD/webroot/index.html"

          rm "$MODULE_BUILD/webroot/theme.css"

      - name: Package module
        run: |
          MODULE_DIR="${RUNNER_TEMP}/nomount-module-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_FILE="${RUNNER_TEMP}/${MODULE_NAME}-${MODULE_VERSION}-${GITHUB_RUN_NUMBER}-${COMMIT_HASH}.zip"

          if [ ! -d "$MODULE_DIR" ]; then
            echo "✘ Module directory not found at $MODULE_DIR"
            exit 1
          fi

          (cd "$MODULE_DIR" && zip -r9 "$RELEASE_FILE" ./* -x ".*" "*/.*")
          echo "RELEASE_FILE=${RELEASE_FILE}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MODULE_NAME }}-${{ env.MODULE_VERSION }}-${{ github.run_number }}-${{ env.COMMIT_HASH }}
          path: ${{ runner.temp }}/nomount-module-${{ github.run_id }}-${{ github.run_attempt }}/

      - name: Publish to GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "✘ Release tag cannot be empty"
            exit 1
          fi

          if [ ! -f "$RELEASE_FILE" ]; then
            echo "✘ Release file not found at $RELEASE_FILE"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "✔ Release $RELEASE_TAG already exists; replacing asset only."
            gh release upload "$RELEASE_TAG" "$RELEASE_FILE" \
              --repo "${{ github.repository }}" \
              --clobber
          else
            echo "✔ Release $RELEASE_TAG does not exist; creating it with autogenerated notes."
            gh release create "$RELEASE_TAG" "$RELEASE_FILE" \
              --repo "${{ github.repository }}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
